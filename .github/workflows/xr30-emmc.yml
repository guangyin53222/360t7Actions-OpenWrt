name: Build XR30‑EMMC ImmortalWrt

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/guangyin53222/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: xr30-emmc.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  FEEDS_CONF: feeds.conf.default
  UPLOAD_FIRMWARE: true

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Clone source code
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          git pull origin $REPO_BRANCH

      - name: Load custom feeds
        run: |
          # 注释禁用：防止模板仓库覆盖源码仓库已经调好的 feeds.conf.default
          # [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update & Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config & clean nand device entries
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          cd openwrt
          sed -i '/DEVICE_cmcc_rax3000m-nand/d' .config
          sed -i '/DEVICE_cmcc_rax3000m-256m-nand/d' .config
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH
          make defconfig
          rm -rf tmp build_dir staging_dir

      - name: Download packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Upload firmware
        if: env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@main
        with:
          name: XR30‑EMMC‑Firmware
          path: openwrt/bin/targets/*/*

      - name: Delete old workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 2
