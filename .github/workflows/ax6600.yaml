name: Build OpenWrt for JDCloud RE-CS-02

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接编译环境（用于 make menuconfig）'
        default: 'true'
        required: false

env:
  REPO_URL: https://github.com/qosmio/openwrt-ipq
  REPO_BRANCH: main-nss
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      # ✅ 关键修复 1：强制清盘（解决 No space left on device）
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/pipx \
            /usr/share/swift /usr/local/share/boost
          sudo apt-get clean
          docker image prune -af
          df -h

      # ✅ 关键修复 2：不再用 /workdir，直接在默认目录操作
      - name: Install build dependencies + Rust
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils \
            bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar \
            flex gawk gettext gcc-multilib g++-multilib git gperf intltool libelf-dev \
            libncurses5-dev libssl-dev libtool lrzsz python3 python3-pip rsync scons \
            squashfs-tools subversion swig texinfo unzip vim wget xmlto zlib1g-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # ✅ 关键修复 3：直接 clone，不创建软链接（解决 No such file or directory）
      - name: Clone source code
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Copy config & scripts
        run: |
          cp .config openwrt/.config
          cp diy-part1.sh openwrt/
          cp diy-part2.sh openwrt/
          chmod +x openwrt/diy-part1.sh openwrt/diy-part2.sh

      - name: Run diy-part1.sh
        working-directory: openwrt
        run: ./diy-part1.sh

      - name: Run diy-part2.sh
        working-directory: openwrt
        run: ./diy-part2.sh

      # ✅ SSH 入口（完美时机：diy 后，download 前）
      - name: SSH connection to Actions
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: mxschmitt/action-tmate@v3

      # ✅ 限制下载深度，减少磁盘占用
      - name: Download package
        working-directory: openwrt
        run: |
          make download -j$(nproc) IGNORE_ERRORS=1

      # ✅ 单线程编译，避免内存/磁盘尖峰
      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_RE-CS-02_NSS
          path: openwrt/bin/targets/qualcommax/ipq60xx/*.bin
